---
- name: Install Python and Flask
  apt:
    name:
      - python3
      - python3-flask
    state: present
    update_cache: yes

- name: Create App 2 directory
  file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Copy App 2 Python code to VM
  copy:
    src: app.py
    dest: "{{ app_directory }}/app.py"
    mode: '0644'

- name: Install App 2 systemd service
  template:
    src: app-two.service.j2
    dest: /etc/systemd/system/app-two.service
    mode: '0644'
  notify: Reload systemd

- name: Enable and start App 2
  systemd:
    name: app-two
    state: started
    enabled: yes
